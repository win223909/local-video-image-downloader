name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-agent.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q local_agent video_downloader
      - name: Run tests
        run: python -m pytest -q
      - name: Validate update manifest JSON
        run: python -m json.tool web/downloads/update.json >/dev/null
      - name: Verify release consistency
        run: python scripts/verify_release_consistency.py
      - name: Check whitespace
        run: git diff --check
